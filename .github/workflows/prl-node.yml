# Builds the miners page from a local pearld instead of scraping the explorer. The trial run synced the
# chain and finished the walk, so this is now the only miners path and prl-daily has lost its miners
# steps: no rate limit, no server action id to rotate.
#
# Cost is front-loaded in the sync: about 90 minutes to sync, 13 to dump, 40 to walk. Caching the datadir
# between runs would remove the sync, but run #1 measured it at ~9.2 GB against a 10 GB per-repo cache
# limit and 3.5 GB of disk left to build the archive in, so it does not fit and the job is priced at a
# cold run every time. That is affordable only because the repo is public and runner minutes are free;
# it was ~143 minutes a run against 2,000 free private minutes a month. If this ever goes private again,
# drop the cadence to weekly or the bill arrives instead.
name: prl-node

on:
  schedule:
    - cron: '50 8 * * *'    # 14:20 IST, an hour after prl-daily has published the chain
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prl-daily        # never run alongside the nightly job: both commit to main
  cancel-in-progress: false

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Disk before
        run: df -h / /mnt | sed 's/^/  /'

      - name: Restore pearld datadir
        uses: actions/cache/restore@v4
        with:
          path: .prl-node
          key: prl-node-${{ github.run_id }}
          restore-keys: prl-node-

      - name: Start pearld
        run: |
          mkdir -p .prl-node
          echo "PRL_RPC_USER=prl" >> $GITHUB_ENV
          echo "PRL_RPC_PASS=$(openssl rand -hex 16)" >> $GITHUB_ENV
      - name: Launch container
        run: |
          docker run -d --name pearld \
            -p 127.0.0.1:44107:44107 \
            -v "$PWD/.prl-node:/root/.pearld" \
            ghcr.io/pearl-research-labs/pearl/pearld:latest \
            --rpcuser="$PRL_RPC_USER" --rpcpass="$PRL_RPC_PASS" \
            --rpclisten=0.0.0.0:44107 --notls
          sleep 20
          docker logs --tail 30 pearld

      - name: Wait for sync
        id: sync
        env:
          PRL_WAIT_BUDGET_MS: 10800000   # 3 h, leaving room for the dump and the walk
        run: node scripts/prl-node-wait.mjs

      - name: Dump chain from the node
        if: steps.sync.outcome == 'success'
        env:
          PRL_CACHE_DIR: .prl-cache-node
          PRL_DUMP_BUDGET_MS: 3600000
        run: node scripts/prl-node-dump.mjs

      - name: Miner behaviour
        if: steps.sync.outcome == 'success'
        env:
          PRL_CACHE_DIR: .prl-cache-node
          PRL_ANALYZE_ONLY: '1'
          NODE_OPTIONS: --max-old-space-size=6144
        run: node scripts/prl-chain.mjs

      - name: Report
        if: always()
        run: |
          echo "sync step: ${{ steps.sync.outcome }}"
          du -sh .prl-node .prl-cache-node 2>/dev/null | sed 's/^/  /' || true
          df -h / /mnt | sed 's/^/  /'
          docker logs --tail 20 pearld 2>&1 | sed 's/^/  /' || true

      - name: Stop pearld, hand the datadir back, decide whether it can be cached
        if: always()
        id: datadir
        run: |
          docker stop pearld || true
          # The container writes as root. $USER is not set in Actions' non-login shell, so the previous
          # `chown -R "$USER"` expanded to an empty name, failed, and was swallowed by `|| true`, leaving
          # the datadir unreadable to the cache step's tar.
          sudo chown -R "$(id -u):$(id -g)" .prl-node \
            || echo "::warning::chown failed; the datadir cannot be read back"
          kb=$(du -sk .prl-node | cut -f1)
          free=$(df -k --output=avail . | tail -1)
          echo "  datadir: $((kb / 1024)) MiB"
          echo "  free:    $((free / 1024)) MiB"
          # Two ceilings, both hard: the cache allows 10 GB per repository, and the archive is built on
          # the same disk the datadir sits on. Run #1 cleared neither. Decide here rather than spend
          # three minutes watching tar fail, and say which ceiling it was.
          if [ "$kb" -ge 8000000 ]; then
            echo "cacheable=no" >> "$GITHUB_OUTPUT"
            echo "::warning::datadir is $((kb / 1024 / 1024)) GiB, over the 10 GB cache limit; skipping the save"
          elif [ "$free" -le "$kb" ]; then
            echo "cacheable=no" >> "$GITHUB_OUTPUT"
            echo "::warning::only $((free / 1024 / 1024)) GiB free to archive $((kb / 1024 / 1024)) GiB; skipping the save"
          else
            echo "cacheable=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Save pearld datadir
        if: always() && steps.datadir.outputs.cacheable == 'yes'
        uses: actions/cache/save@v4
        with:
          path: .prl-node
          key: prl-node-${{ github.run_id }}

      - name: Commit miner data
        if: steps.sync.outcome == 'success'
        run: bash scripts/commit-data.sh miners data/miner_behavior.json
