# Hourly trigger for the miner-behaviour indexer. Vercel Hobby limits its own cron to once a day,
# and a daily run cannot keep up with the chain, so GitHub Actions calls the route instead.
# Needs the repo secret CRON_SECRET, the same value as the Vercel env var.
name: prl-index

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS --max-time 90 -H "authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://prl-stats.vercel.app/api/cron/prl-index
