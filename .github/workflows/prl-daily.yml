# Daily miner-behaviour refresh. Scrapes new blocks into Turso, reruns the fate walk, publishes the page JSON.
# First run (manual dispatch) backfills from block 1 in ~4-5 h; later runs take ~25 min.
# Secrets: TURSO_DATABASE_URL, TURSO_AUTH_TOKEN.
name: prl-daily

on:
  schedule:
    - cron: '10 3 * * *'
  workflow_dispatch:

concurrency:
  group: prl-daily
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore chain cache
        uses: actions/cache/restore@v4
        with:
          path: .prl-cache
          key: prl-chain-${{ github.run_id }}
          restore-keys: prl-chain-
      - name: Refresh
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=6144
        run: node scripts/prl-chain.mjs
      - name: Save chain cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .prl-cache
          key: prl-chain-${{ github.run_id }}
