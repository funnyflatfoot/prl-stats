# Nightly refresh of both pages. Runs the repo's own ingest + market scripts for the chain page and the
# fate walk for the miners page, then commits the refreshed data/ files, which is what redeploys the site.
# No credentials, no external storage: the 1.7 GB chain dump lives in the Actions cache between runs
# (.prl-cache). If that cache is ever evicted the next run re-backfills from block 1 (~4 h) and, since it
# saves progress either way, finishes on the following run.
name: prl-daily

on:
  schedule:
    - cron: '30 18 * * *'   # 00:00 IST
  workflow_dispatch:

concurrency:
  group: prl-daily
  cancel-in-progress: false

permissions:
  contents: write   # the job commits data/ back to main

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ---- chain page: blocks since #99,000 and the CoinGecko market snapshot ----
      - name: Ingest new blocks
        continue-on-error: true   # exit 2 = explorer action id rotated; headers fetched so far are still persisted
        run: node scripts/ingest.mjs
      - name: Market snapshot
        continue-on-error: true   # CoinGecko rate limits; yesterday's market.json stays
        run: node scripts/market.mjs

      # ---- miners page: full-graph fate walk ----
      - name: Restore chain dump cache
        uses: actions/cache/restore@v4
        with:
          path: .prl-cache
          key: prl-chain-${{ github.run_id }}
          restore-keys: prl-chain-
      - name: Miner behaviour
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: node scripts/prl-chain.mjs
      - name: Save chain dump cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .prl-cache
          key: prl-chain-${{ github.run_id }}

      # ---- publish: the commit is the deploy ----
      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --quiet --cached; then
            echo "no data changes"
            exit 0
          fi
          TIP=$(node -e "try{console.log(require('./data/checkpoint.json').lastIngestedHeight)}catch{console.log('?')}")
          MIN=$(node -e "try{console.log(require('./data/miner_behavior.json').tip_height)}catch{console.log('?')}")
          git commit -m "Nightly data refresh: chain #${TIP}, miners #${MIN}"
          git pull --rebase --autostash
          git push
