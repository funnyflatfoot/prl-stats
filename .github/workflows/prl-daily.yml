# Daily refresh of both pages. Chain page: the repo's own ingest + market scripts, store synced through Turso.
# Miners page: scrapes new blocks into Turso, reruns the fate walk, publishes the page JSON.
# First run (manual dispatch) backfills the miner chain from block 1 in ~4-5 h; later runs take ~30 min.
# Secrets: TURSO_DATABASE_URL, TURSO_AUTH_TOKEN. Optional: COINGECKO_API_KEY.
name: prl-daily

on:
  schedule:
    - cron: '30 18 * * *'   # 00:00 IST
  workflow_dispatch:

concurrency:
  group: prl-daily
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ---- chain page (blocks since #99,000, CoinGecko market) ----
      - name: Pull chain store from db
        run: node scripts/prl-sync-chain.mjs pull
      - name: Ingest new blocks
        continue-on-error: true   # exit 2 = explorer action id rotated; headers are still persisted
        run: node scripts/ingest.mjs
      - name: Market snapshot
        continue-on-error: true   # CoinGecko rate limits; yesterday's market.json stays
        run: node scripts/market.mjs
      - name: Push chain store to db
        run: node scripts/prl-sync-chain.mjs push

      # ---- miners page (full chain, fate walk) ----
      - name: Restore miner chain cache
        uses: actions/cache/restore@v4
        with:
          path: .prl-cache
          key: prl-chain-${{ github.run_id }}
          restore-keys: prl-chain-
      - name: Miner behaviour
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: node scripts/prl-chain.mjs
      - name: Save miner chain cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .prl-cache
          key: prl-chain-${{ github.run_id }}
