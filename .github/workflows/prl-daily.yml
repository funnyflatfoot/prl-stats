# Nightly refresh of the chain page: new blocks since #99,000 and the CoinGecko snapshot, committed as
# soon as they are in hand.
#
# The miners page is no longer built here. It is built by prl-node from a local pearld, because the
# explorer rate-limits one IP to roughly a thousand requests and a runner reaches that in two minutes,
# which made a nightly walk impossible. Two failures compounded while it lived here: the walk died on a
# 429, and because the single commit sat at the end of the job, a failed walk discarded a perfectly
# good chain ingest along with it. The chain now publishes before anything that can fail, which is what
# scripts/commit-data.sh was written for.
name: prl-daily

on:
  schedule:
    - cron: '30 18 * * *'   # 00:00 IST
  workflow_dispatch:

concurrency:
  group: prl-daily          # shared with prl-node: both commit to main
  cancel-in-progress: false

permissions:
  contents: write   # the job commits data/ back to main

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60     # ingest and market only; the hours-long walk moved to prl-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ingest new blocks
        continue-on-error: true   # exit 2 = explorer action id rotated; headers fetched so far are still persisted
        run: node scripts/ingest.mjs

      - name: Market snapshot
        continue-on-error: true   # CoinGecko rate limits; yesterday's market.json stays
        run: node scripts/market.mjs

      # Publishes whatever the two steps above managed to fetch. Both are continue-on-error, so a bad
      # night leaves the committed files alone rather than taking the job down; commit-data.sh no-ops
      # when nothing changed.
      - name: Commit chain data
        run: bash scripts/commit-data.sh chain data/blocks.ndjson data/checkpoint.json data/market.json
